name: Build Developer Tool

on:
  push:
    branches: [main]
    paths:
      - 'developer-tool/**'
      - '.github/workflows/build-developer-tool.yml'
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: developer-tool
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: developer-tool/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Collab-Deal-OS-Developer-Tool-Windows
          path: developer-tool/dist/*.exe
          if-no-files-found: error
